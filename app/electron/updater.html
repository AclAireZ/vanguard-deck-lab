<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Vanguard D Deck Lab</title>
<style>
  :root { color-scheme: dark; --gold: #f4c356; --cyan: #56dcec; --dim: #9aa1d2; --line: #2c3676; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 20%, #232a6b 0%, #0b0d24 60%, #050612 100%); color: #eef0ff; font: 14px 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif; display: grid; place-items: center; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .box { width: 100%; padding: 0 34px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .em { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed rgba(244, 195, 86, .7); position: relative; animation: spin 9s linear infinite; }
  .em b { font: italic 700 30px 'Chakra Petch', 'Segoe UI', sans-serif; color: var(--gold); animation: spin 9s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font: italic 700 24px 'Chakra Petch', 'Segoe UI', sans-serif; letter-spacing: .02em; }
  h1 span { color: var(--gold); }
  #msg { min-height: 1.4em; color: #dfe3ff; }
  #sub { min-height: 1.2em; color: var(--dim); font-size: 12.5px; }
  .bar { width: 100%; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b9791d, var(--gold), #fff3c4); box-shadow: 0 0 14px rgba(244, 195, 86, .6); transition: width .25s; }
  .bar.wait i { width: 35%; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .acts { display: flex; gap: 10px; -webkit-app-region: no-drag; }
  .acts[hidden] { display: none; }
  a.btn { color: #1a1205; background: linear-gradient(180deg, #fff3c4, var(--gold)); padding: 9px 18px; border-radius: 10px 3px 10px 3px; text-decoration: none; font-weight: 700; }
  a.btn.ghost { color: #eef0ff; background: none; border: 1px solid var(--line); }
  .ver { position: fixed; right: 12px; bottom: 8px; color: var(--dim); font-size: 11px; }
</style></head>
<body>
  <div class="box">
    <div class="em" aria-hidden="true"><b>D</b></div>
    <h1>Vanguard D <span>Deck Lab</span></h1>
    <div id="msg">กำลังตรวจสอบอัปเดต…</div>
    <div class="bar wait" id="bar"><i id="fill"></i></div>
    <div id="sub"></div>
    <div class="acts" id="acts" hidden><a class="btn" href="vgact://download">ดาวน์โหลดเวอร์ชันใหม่</a><a class="btn ghost" href="vgact://quit">ปิดเกม</a></div>
  </div>
  <div class="ver" id="ver"></div>
<script>
  // the main process drives this page: setState({ msg, sub, pct (0–100 or null = waiting), acts: true })
  window.setState = s => {
    if (s.msg != null) document.getElementById('msg').textContent = s.msg;
    if (s.sub != null) document.getElementById('sub').textContent = s.sub;
    const bar = document.getElementById('bar'); if (s.pct === null) bar.classList.add('wait'); else if (typeof s.pct === 'number') { bar.classList.remove('wait'); document.getElementById('fill').style.width = Math.max(0, Math.min(100, s.pct)) + '%'; }
    if (s.acts != null) document.getElementById('acts').hidden = !s.acts;
    if (s.ver) document.getElementById('ver').textContent = 'เวอร์ชัน ' + s.ver;
  };
</script>
</body></html>
