name: Online room test (real internet)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  quickroom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the game
        run: node build.mjs
      - name: Install a browser for the test
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Can this machine reach the official card pictures?
        shell: bash
        run: |
          a=$(curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}" https://cf-vanguard.com/wordpress/wp-content/images/cardlist/DZ-BT07/dzbt07_016.png)
          b=$(curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}" https://en.cf-vanguard.com/wordpress/wp-content/images/cardlist/dzbt07/dzbt07_016.png)
          echo "::notice title=pictures reachable::JP $a | EN $b"
          case "$a$b" in *200*) echo "PICS_REQUIRED=1" >> "$GITHUB_ENV";; esac
      - name: Two game windows meet through the real PeerJS service and play a whole game
        shell: bash
        run: |
          set +e
          CLOUD=1 PW=/tmp/pw/node_modules/playwright/index.mjs node test/quickroom.mjs > out.txt 2>&1; code=$?
          cat out.txt
          msg=$(tail -c 3500 out.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=quickroom result::$msg"
          exit $code
      - name: Room list + relay through the real public MQTT brokers (no Claude, no account)
        if: always()
        shell: bash
        run: |
          set +e
          CLOUD=1 PW=/tmp/pw/node_modules/playwright/index.mjs node test/rooms.mjs list,relay > rooms.txt 2>&1; code=$?
          cat rooms.txt
          msg=$(tail -c 3500 rooms.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=rooms result::$msg"
          exit $code
      - name: Real account server (Supabase) — sign up, decks, history, friends, row rules
        if: always()
        shell: bash
        run: |
          set +e
          node test/account-real.mjs > acct.txt 2>&1; code=$?
          cat acct.txt
          msg=$(tail -c 3500 acct.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=account server result::$msg"
          exit $code
