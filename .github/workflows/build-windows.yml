name: Build game (Windows, Android, iPhone)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  VG_VERSION: 1.0.${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the game page
        run: node build.mjs
      - name: Put the game inside the app
        shell: bash
        run: mkdir -p app/electron/game && cp dist/local/VanguardDeckLab.html app/electron/game/
      - name: Version number (1.0.<build number>, used by auto-update)
        working-directory: app/electron
        run: npm version ${{ env.VG_VERSION }} --no-git-tag-version --allow-same-version
      - name: Install Electron
        working-directory: app/electron
        run: npm install
      - name: Smoke test (start the app on Windows)
        working-directory: app/electron
        shell: bash
        run: |
          set +e
          node smoke.mjs > smoke.txt 2>&1; code=$?
          cat smoke.txt
          msg=$(tail -c 3500 smoke.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=smoke result::$msg"
          exit $code
      - name: Picture cache test (pictures kept on disk, shown with the site off)
        working-directory: app/electron
        shell: bash
        run: |
          set +e
          node cachetest.mjs > cache.txt 2>&1; code=$?
          cat cache.txt
          msg=$(tail -c 2000 cache.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=picture cache result::$msg"
          exit $code
      - name: Make the installer and the portable exe
        working-directory: app/electron
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: |
            app/electron/dist/*.exe
            app/electron/dist/*.blockmap
            app/electron/dist/latest.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the game page
        run: node build.mjs
      - name: Make the Android project (Capacitor)
        run: bash app/mobile/prepare.sh android ${{ env.VG_VERSION }} ${{ github.run_number }}
      - name: Compile
        working-directory: app/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          cd app/mobile/android/app/build/outputs/apk/release
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.jks; else
            echo "::warning title=Android signing::No permanent signing key (secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS). This APK is signed with a one-time key: installing the next version needs the old app removed first."
            KS_PASS=temppass123; keytool -genkeypair -keystore ks.jks -alias vgdl -keyalg RSA -keysize 2048 -validity 10000 -storepass $KS_PASS -keypass $KS_PASS -dname "CN=Vanguard Deck Lab temp" ; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias vgdl --ks-pass env:KS_PASS --key-pass env:KS_PASS --out VanguardDeckLab-${{ env.VG_VERSION }}.apk aligned.apk
          $BT/apksigner verify --print-certs VanguardDeckLab-${{ env.VG_VERSION }}.apk | head -3
          rm -f ks.jks aligned.apk
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: app/mobile/android/app/build/outputs/apk/release/VanguardDeckLab-*.apk
      - name: Enable KVM (emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        continue-on-error: true
        with:
          api-level: 34
          emulator-boot-timeout: 900
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash app/mobile/smoke-android.sh app/mobile/android/app/build/outputs/apk/release/VanguardDeckLab-${{ env.VG_VERSION }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-android
          path: |
            android-shot.png
            logcat.txt

  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the game page
        run: node build.mjs
      - name: Make the iPhone project (Capacitor)
        run: bash app/mobile/prepare.sh ios ${{ env.VG_VERSION }} ${{ github.run_number }}
      - name: Build for the simulator and start it there
        working-directory: app/mobile/ios/App
        run: |
          set -e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build-sim CODE_SIGNING_ALLOWED=NO build -quiet
          DT=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9][A-Za-z0-9-]*' | head -1)
          RT=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "device $DT runtime $RT"
          UDID=$(xcrun simctl create vg "$DT" "$RT")
          xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b
          xcrun simctl install $UDID ../../build-sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty $UDID com.aclairez.vanguarddecklab > ../../sim-console.txt 2>&1 &
          sleep 45
          xcrun simctl io $UDID screenshot ../../ios-shot.png
          kill %1 || true
          grep -E "VGDL|ERROR|Error" ../../sim-console.txt | tail -30 > ../../sim-short.txt || true
          cat ../../sim-short.txt
          msg=$(tail -c 2500 ../../sim-short.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=iphone app console::$msg"
          grep -q "\[VGDL\] ready" ../../sim-console.txt || { echo "::error::the game page did not start in the iPhone app"; exit 1; }
      - name: Build for iPhone (unsigned .ipa, signed on install by Sideloadly / AltStore)
        working-directory: app/mobile/ios/App
        run: |
          set -e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../../build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
          cd ../..; rm -rf Payload; mkdir Payload
          cp -R build-dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry VanguardDeckLab-${{ env.VG_VERSION }}.ipa Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: rel-ios
          path: app/mobile/VanguardDeckLab-*.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-ios
          path: |
            app/mobile/ios-shot.png
            app/mobile/sim-console.txt

  release:
    needs: [windows, android, ios]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: rel-*, path: out, merge-multiple: true }
      - run: ls -la out
      - name: Release (download page + auto-update feed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VG_VERSION }}
          name: Vanguard Deck Lab ${{ env.VG_VERSION }}
          prerelease: false
          make_latest: true
          files: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
            out/*.apk
            out/*.ipa
          body: |
            **Windows** — ดาวน์โหลด **VanguardDeckLab-Setup** (ติดตั้งแล้วมีไอคอนบนเดสก์ท็อป และ**อัปเดตตัวเองอัตโนมัติ**) หรือ **VanguardDeckLab-Portable** (เปิดได้เลยไม่ต้องติดตั้ง แต่จะแค่แจ้งว่ามีเวอร์ชันใหม่)
            Windows อาจขึ้นหน้าจอ "Windows protected your PC" เพราะไฟล์ไม่ได้เซ็นชื่อ ให้กด More info → Run anyway

            **Android** — ดาวน์โหลดไฟล์ **.apk** บนมือถือแล้วเปิด ครั้งแรกเครื่องจะถามให้อนุญาต "ติดตั้งแอปที่ไม่รู้จัก" ให้กดอนุญาต เวอร์ชันใหม่ติดตั้งทับได้เลย
            **iPhone / iPad** — ดาวน์โหลดไฟล์ **.ipa** ลงคอม แล้วติดตั้งด้วย Sideloadly หรือ AltStore (ล็อกอิน Apple ID ของคุณเอง) แล้วไปที่ ตั้งค่า → ทั่วไป → VPN และการจัดการอุปกรณ์ → เชื่อถือ Apple ID ของคุณ · ใช้ Apple ID ฟรีต้องติดตั้งใหม่ทุก 7 วัน

            ถ้าแถวไหนไม่มีไฟล์ แปลว่ารอบนี้ส่วนนั้นสร้างไม่สำเร็จ ใช้ไฟล์จากเวอร์ชันก่อนได้
            commit ${{ github.sha }}
