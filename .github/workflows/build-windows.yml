name: Build Windows game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the game page
        run: node build.mjs
      - name: Put the game inside the app
        shell: bash
        run: mkdir -p app/electron/game && cp dist/local/VanguardDeckLab.html app/electron/game/
      - name: Version number (1.0.<build number>, used by auto-update)
        working-directory: app/electron
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Install Electron
        working-directory: app/electron
        run: npm install
      - name: Smoke test (start the app on Windows)
        working-directory: app/electron
        shell: bash
        run: |
          set +e
          node smoke.mjs > smoke.txt 2>&1; code=$?
          cat smoke.txt
          msg=$(tail -c 3500 smoke.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=smoke result::$msg"
          exit $code
      - name: Picture cache test (pictures kept on disk, shown with the site off)
        working-directory: app/electron
        shell: bash
        run: |
          set +e
          node cachetest.mjs > cache.txt 2>&1; code=$?
          cat cache.txt
          msg=$(tail -c 2000 cache.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=picture cache result::$msg"
          exit $code
      - name: Make the installer and the portable exe
        working-directory: app/electron
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VanguardDeckLab-Windows
          path: |
            app/electron/dist/*.exe
            app/electron/dist/latest.yml
            app/electron/smoke.png
      - name: Release (download page + auto-update feed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vanguard Deck Lab 1.0.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: |
            app/electron/dist/*.exe
            app/electron/dist/*.blockmap
            app/electron/dist/latest.yml
          body: |
            ดาวน์โหลด **VanguardDeckLab-Setup** (ติดตั้งแล้วมีไอคอนบนเดสก์ท็อป และ**อัปเดตตัวเองอัตโนมัติ**) หรือ **VanguardDeckLab-Portable** (เปิดได้เลยไม่ต้องติดตั้ง แต่จะแค่แจ้งว่ามีเวอร์ชันใหม่)
            Windows อาจขึ้นหน้าจอ "Windows protected your PC" เพราะไฟล์ไม่ได้เซ็นชื่อ ให้กด More info → Run anyway
            commit ${{ github.sha }}
