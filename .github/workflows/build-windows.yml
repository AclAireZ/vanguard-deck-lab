name: Build Windows game
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build the game page
        run: node build.mjs
      - name: Put the game inside the app
        shell: bash
        run: mkdir -p app/electron/game && cp dist/local/VanguardDeckLab.html app/electron/game/
      - name: Install Electron
        working-directory: app/electron
        run: npm install
      - name: Smoke test (start the app on Windows)
        working-directory: app/electron
        run: node smoke.mjs
      - name: Make the installer and the portable exe
        working-directory: app/electron
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VanguardDeckLab-Windows
          path: |
            app/electron/dist/*.exe
            app/electron/smoke.png
      - name: Latest release (download page for you and friends)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vanguard Deck Lab (latest)
          prerelease: false
          make_latest: true
          files: app/electron/dist/*.exe
          body: |
            ดาวน์โหลด **VanguardDeckLab-Setup** (ติดตั้งแล้วมีไอคอนบนเดสก์ท็อป) หรือ **VanguardDeckLab-Portable** (เปิดได้เลยไม่ต้องติดตั้ง)
            Windows อาจขึ้นหน้าจอ "Windows protected your PC" เพราะไฟล์ไม่ได้เซ็นชื่อ ให้กด More info → Run anyway
